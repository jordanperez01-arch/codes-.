<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Flores Amarillas 🌻✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            margin: 0;
            user-select: none;
        }

        .font-dancing {
            font-family: 'Dancing Script', cursive;
        }

        /* Efecto de resplandor para los textos de la galaxia */
        .galaxy-text {
            text-shadow: 0 0 8px rgba(255, 223, 0, 0.9), 0 0 15px rgba(255, 180, 0, 0.6);
        }

        /* Estilo Glassmorphism para la carta/modal */
        .glass-card {
            background: rgba(20, 15, 5, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 40px rgba(255, 200, 0, 0.25);
        }

        /* Animación suave flotante para las flores */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }

        .flower-item {
            animation: floatSlow 4s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .flower-item:hover {
            filter: drop-shadow(0 0 15px rgba(255, 230, 0, 1));
            transform: scale(1.2) !important;
        }
    </style>
</head>
<body class="w-screen h-screen relative flex items-center justify-center">

    <!-- Canvas para el fondo de la Galaxia en Espiral -->
    <canvas id="galaxyCanvas" class="absolute inset-0 z-0"></canvas>

    <!-- Capa interactiva de Flores y Mensajes flotantes -->
    <div id="flowerUniverse" class="absolute inset-0 z-10 pointer-events-none"></div>

    <!-- Título Principal en Pantalla -->
    <div class="absolute top-6 text-center z-10 pointer-events-none px-4">
        <h1 class="text-3xl md:text-5xl font-dancing font-bold text-amber-300 galaxy-text">
            Eres Mi Sol 🌻✨
        </h1>
        <p class="text-amber-200/70 text-xs md:text-sm mt-1">
            Haz clic en las flores de la galaxia para descubrir tus mensajes
        </p>
    </div>

    <!-- Modal con la carta/frase bonita al presionar una flor -->
    <div id="messageModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
        <div id="modalContent" class="glass-card max-w-md w-full p-6 md:p-8 rounded-3xl text-center transform scale-90 transition-transform duration-300 relative border border-amber-400/40">
            <button onclick="closeModal()" class="absolute top-3 right-4 text-amber-300/80 hover:text-amber-200 text-xl font-bold">
                ✕
            </button>
            <div id="modalIcon" class="text-6xl mb-3">💐</div>
            <h2 id="modalTitle" class="text-2xl md:text-3xl font-dancing font-bold text-amber-300 mb-3 galaxy-text">
                Para Ti 💛
            </h2>
            <p id="modalMessage" class="text-amber-100/90 text-sm md:text-base leading-relaxed font-light mb-6">
                <!-- Mensaje dinámico -->
            </p>
            <button onclick="closeModal()" class="px-6 py-2 rounded-full bg-gradient-to-r from-amber-400 to-yellow-500 text-black font-semibold text-xs md:text-sm hover:scale-105 active:scale-95 transition shadow-lg shadow-amber-500/30">
                Guardar con cariño ✨
            </button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN Y MENSAJES DE LAS FLORES ---
        const flowersData = [
            {
                label: "Eres mi sol 💛",
                icon: "🌻",
                title: "Mi Sol Radiante",
                message: "Así como los girasoles siempre buscan la luz del sol, mi corazón siempre busca la tuya. Gracias por iluminar cada uno de mis días.",
                x: 50, y: 50, scale: 1.4 // Centro de la galaxia
            },
            {
                label: "Te amo ✨",
                icon: "💐",
                title: "Te Amo Demasiado",
                message: "No hay galaxia ni universo suficiente para medir todo el amor que siento por ti. Eres mi lugar favorito en el mundo.",
                x: 50, y: 22, scale: 1.1
            },
            {
                label: "Eres única 💖",
                icon: "🌹",
                title: "Única e Irremplazable",
                message: "Entre millones de estrellas en el cielo, tú eres la que más brilla. Tu sonrisa hace que todo valga la pena.",
                x: 25, y: 72, scale: 1.0
            },
            {
                label: "Siempre juntos 💍",
                icon: "🌻",
                title: "Nuestro Camino",
                message: "Quiero caminar a tu lado en todas las estaciones de la vida, floreciendo juntos sin importar nada.",
                x: 72, y: 75, scale: 1.1
            },
            {
                label: "Te adoro 🥺",
                icon: "🌾",
                title: "Mi Persona Favorita",
                message: "Adoro tu forma de ser, tu risa, tus abrazos y la forma bonita en la que haces que todo sea especial.",
                x: 22, y: 32, scale: 0.95
            },
            {
                label: "My Love 💛",
                icon: "💐",
                title: "Amor Infinito",
                message: "Estas flores amarillas son solo un pequeño reflejo de la alegría enorme que me da tenerte en mi vida.",
                x: 15, y: 52, scale: 1.0
            },
            {
                label: "Eres mi todo ✨",
                icon: "🌻",
                title: "Mi Todo",
                message: "Contigo descubrí lo bonito que es querer sin medidas. Eres mi sueño hecho realidad.",
                x: 82, y: 42, scale: 0.9
            },
            {
                label: "Mi tesoro 💖",
                icon: "🌷",
                title: "Vales Oro",
                message: "Gracias por existir y por llenar mi universo de colores amarillos, cálidos y llenos de luz.",
                x: 76, y: 24, scale: 0.95
            }
        ];

        // --- 2. RENDERIZAR FLORES INTERACTIVAS ---
        const container = document.getElementById('flowerUniverse');

        flowersData.forEach((data, index) => {
            const div = document.createElement('div');
            div.className = 'absolute pointer-events-auto flower-item flex flex-col items-center justify-center text-center';
            div.style.left = `${data.x}%`;
            div.style.top = `${data.y}%`;
            div.style.transform = `translate(-50%, -50%) scale(${data.scale})`;

            div.innerHTML = `
                <div class="text-4xl md:text-5xl filter drop-shadow-[0_0_12px_rgba(255,215,0,0.8)]">
                    ${data.icon}
                </div>
                <span class="text-[10px] md:text-xs font-semibold text-amber-300 galaxy-text mt-1 bg-black/40 px-2 py-0.5 rounded-full border border-amber-400/30 whitespace-nowrap">
                    ${data.label}
                </span>
            `;

            div.onclick = () => openModal(data);
            container.appendChild(div);
        });

        // --- 3. LÓGICA DEL MODAL DE MENSAJES ---
        const modal = document.getElementById('messageModal');
        const modalContent = document.getElementById('modalContent');

        function openModal(data) {
            document.getElementById('modalIcon').textContent = data.icon;
            document.getElementById('modalTitle').textContent = data.title;
            document.getElementById('modalMessage').textContent = data.message;

            // Efecto Confetti amarillo al hacer clic
            confetti({
                particleCount: 50,
                spread: 60,
                origin: { y: 0.6 },
                colors: ['#ffe033', '#ffd700', '#ffb700', '#ffffff']
            });

            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.classList.add('opacity-100');
            modalContent.classList.remove('scale-90');
            modalContent.classList.add('scale-100');
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.classList.remove('opacity-100');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-90');
        }

        // --- 4. CANVAS DE LA GALAXIA EN ESPIRAL ---
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const stars = [];
        const numStars = 1200;

        // Crear partículas para la galaxia en espiral
        for (let i = 0; i < numStars; i++) {
            const radius = Math.random() * Math.max(canvas.width, canvas.height) * 0.45;
            const arms = 3;
            const armAngle = (i % arms) * ((2 * Math.PI) / arms);
            const spin = radius * 0.003;
            const angle = armAngle + spin + (Math.random() - 0.5) * 0.5;

            stars.push({
                radius: radius,
                angle: angle,
                speed: 0.0005 + Math.random() * 0.0005,
                size: Math.random() * 1.8 + 0.3,
                color: Math.random() > 0.3 ? '#fbbf24' : (Math.random() > 0.5 ? '#fef08a' : '#ffffff'),
                alpha: Math.random() * 0.8 + 0.2
            });
        }

        function drawGalaxy() {
            ctx.fillStyle = '#030200';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Resplandor central dorado
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 180);
            gradient.addColorStop(0, 'rgba(255, 200, 0, 0.35)');
            gradient.addColorStop(0.5, 'rgba(255, 180, 0, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 200, 0, Math.PI * 2);
            ctx.fill();

            // Dibujar estrellas en espiral
            stars.forEach(star => {
                star.angle += star.speed;

                const x = centerX + Math.cos(star.angle) * star.radius;
                const y = centerY + Math.sin(star.angle) * (star.radius * 0.5); // Elipse 3D

                ctx.save();
                ctx.globalAlpha = star.alpha;
                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(x, y, star.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            requestAnimationFrame(drawGalaxy);
        }

        drawGalaxy();
    </script>
</body>
</html>
